<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0e1014">
<title>Practice Hacks</title>
<meta name="description" content="Practice versions of FiveM hacking minigames.">
<style>
  :root{--text:#e2e2e2;--muted:#8d8d8d;--accent:#ffb000;--card:#15171b;--line:#272a30}
  *{box-sizing:border-box}
  html{min-height:100%;background:#08090b radial-gradient(ellipse 120% 900px at 50% 0%,#1c1f25 0%,#0c0d10 60%,#08090b 100%) no-repeat}
  body{margin:0;color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:1180px;margin:0 auto;padding:40px 24px 32px}
  h1{margin:0 0 4px;font-size:30px;letter-spacing:-.3px}
  h1 span{color:var(--accent)}
  h1{display:flex;align-items:center;gap:12px}
  h1 .logo{width:40px;height:40px;flex:none}
  .quote{display:inline-block;margin:0 0 18px;padding:6px 14px 6px 12px;border-left:3px solid var(--accent);background:rgba(255,176,0,.07);border-radius:0 6px 6px 0;color:#f0d9a0;font-style:italic;font-size:15px;letter-spacing:.2px}
  .lead{margin:0 0 24px;color:var(--muted)}
  #jobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(460px,100%),1fr));gap:16px;align-items:start}
  section.job{margin:0;background:rgba(17,19,23,.65);border:1px solid var(--line);border-radius:12px;padding:12px 12px 12px;scroll-margin-top:16px}
  section.job h2{display:flex;align-items:baseline;gap:10px;margin:0 0 10px;padding:2px 4px 9px;border-bottom:1px solid var(--line);font-size:16px;letter-spacing:-.1px}
  section.job h2 small{font-size:12px;font-weight:500;color:var(--muted)}
  .grid{display:flex;flex-direction:column;gap:10px}
  a.card{display:flex;flex-direction:row;align-items:stretch;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:9px;overflow:hidden;transition:border-color .15s, transform .15s}
  a.card:hover{border-color:#5a4a20;transform:translateY(-1px)}
  .thumb{width:118px;flex:none;background:#0f0f10;display:flex;align-items:center;justify-content:center;border-right:1px solid var(--line);padding:8px}
  .thumb svg{width:100%;height:auto;max-height:100px}
  .body{padding:11px 14px 12px;min-width:0}
  .body h3{margin:0 0 3px;font-size:15.5px;line-height:1.3}
  .body p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}
  .tags{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .tags span{font-size:11px;color:#c9a14a;border:1px solid #3d3420;border-radius:999px;padding:0 8px}
  @media (max-width:480px){.thumb{width:88px}.wrap{padding:28px 14px}}
  footer{margin-top:28px;color:#5f5f5f;font-size:12.5px}
</style>
</head>
<body>
<div class="wrap">
  <blockquote class="quote">&ldquo;Mr Moss approved&rdquo;</blockquote>
  <h1><img class="logo" src="favicon.svg" alt="" width="40" height="40"><div>Practice <span>Hacks</span></div></h1>
  <p class="lead">Practice versions of server hacking minigames. Pick one and train until it's muscle memory.</p>

  <div id="jobs"></div>

  <footer>Fan-made practice tools. Not affiliated with FiveM, Rockstar Games or any server.</footer>
</div>

<script>
  // Sections, in the order they appear on the page.
  const JOBS = [
    {id: 'bobcat',    name: 'Bobcat'},
    {id: 'arms-deal', name: 'Arms Deal'},
    {id: 'dark-queue', name: 'Dark Queue'},
    {id: 'store-safe', name: '24/7 Store Safe'},
  ];

  // To add a game: put it in its own folder (e.g. lockpick/index.html) and add an entry here,
  // with `job` set to one of the ids above (add a new job above if needed).
  const GAMES = [
    {
      path: 'maze/',
      job: 'arms-deal',
      name: 'Dark Maze',
      desc: 'Drag the ball through a maze you can only see around you. The exit is in one of the corners — find it before the bar fills.',
      tags: ['Mouse drag', '50s timer', 'Wall penalties'],
      thumb: `<svg viewBox="0 0 100 100" fill="none" stroke="#ffb000" stroke-width="2.4" stroke-linecap="round">
        <defs><radialGradient id="l" cx="46" cy="52" r="40" gradientUnits="userSpaceOnUse"><stop offset=".55" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
        <mask id="m"><rect width="100" height="100" fill="url(#l)"/></mask></defs>
        <g mask="url(#m)" style="filter:drop-shadow(0 0 2px #ff9d00)">
          <path d="M10 10H90V90H10Z M30 10V30H50 M70 10V50 M10 50H30V70 M50 30V70H70 M30 90V70 M90 70H70V90 M50 50H30"/>
        </g>
        <rect x="76" y="14" width="10" height="10" rx="1" fill="#ff2b2b" stroke="none" mask="url(#m)"/>
        <circle cx="46" cy="58" r="3.6" fill="#f4f4f4" stroke="none"/>
      </svg>`
    },
    {
      path: 'sequence/',
      job: 'bobcat',
      name: 'Hex Sequence',
      desc: 'Enter the 4 codes in order: 1→2 same column, 2→3 same row, 3→4 same column. One wrong click fails the stage.',
      tags: ['Click', '3 stages', '60s per stage'],
      thumb: `<svg viewBox="0 0 100 100" font-family="Courier New,monospace" font-weight="700" font-size="8.5" text-anchor="middle">
        <g fill="none" stroke="#d3133f" stroke-width="1">
          ${[0,1,2,3].map(r=>[0,1,2,3].map(c=>`<rect x="${12+c*20}" y="${14+r*20}" width="16" height="16" rx="1.5" ${c===2?'stroke="#f3c234"':''}/>`).join('')).join('')}
        </g>
        <rect x="32" y="34" width="16" height="16" rx="1.5" fill="#8e1230" stroke="#d3133f"/>
        ${[['7A','E9','BD','1C'],['55','7A','FF','E9'],['BD','E9','7A','55'],['1C','FF','BD','7A']].map((row,r)=>row.map((t,c)=>`<text x="${20+c*20}" y="${25+r*20}" fill="${r===1&&c===1?'#fff':c===2?'#f3c234':'#d3133f'}">${t}</text>`).join('')).join('')}
      </svg>`
    },
    {
      path: 'columns/',
      job: 'dark-queue',
      name: 'Align the Columns – Dark Queue Crate Hack',
      desc: 'Each column\'s gap slides up and down. Click when the bright column\'s gap is on the line to lock it. Misses cost time.',
      tags: ['Timing', '8 columns', '20s timer'],
      thumb: `<svg viewBox="0 0 100 100">
        ${[0,1,2,3,4,5,6,7].map(k=>{const x=10+k*11, c=50+28*Math.sin(1.2-k*Math.PI/4)*(k<2?0:1), a=k===2;
          const f=a?'rgba(214,172,40,.95)':'rgba(190,150,35,.4)';
          return `<rect x="${x}" y="6" width="6" height="${c-4-6}" rx="1" fill="${f}" stroke="#e8be3c" stroke-width=".5"/><rect x="${x}" y="${c+4}" width="6" height="${94-c-4}" rx="1" fill="${f}" stroke="#e8be3c" stroke-width=".5"/>`}).join('')}
        <rect x="6" y="47.5" width="88" height="5" fill="rgba(214,172,40,.3)"/>
        <path d="M6 47.5H94M6 52.5H94" stroke="#f0c846" stroke-width=".5" stroke-dasharray="1 1"/>
      </svg>`
    },
    {
      path: 'safe/',
      job: 'store-safe',
      name: 'Ball Gate',
      desc: 'Hold left click to open the gate and let the orange balls in, let go to keep the red ones out. One wrong ball and you fail.',
      tags: ['Hold click', '3 phases', '1 mistake = fail'],
      thumb: `<svg viewBox="0 0 100 100">
        ${[['#a77506','#f2b21c',14],['#b22d2a','#ff4a3d',30],['#a77506','#f2b21c',46],['#a77506','#f2b21c',62]].map(([f,s,y])=>`<circle cx="50" cy="${y}" r="5.5" fill="${f}" stroke="${s}" stroke-width=".8"/>`).join('')}
        <circle cx="38" cy="76" r="5.5" fill="#b22d2a" stroke="#ff4a3d" stroke-width=".8"/>
        <circle cx="62" cy="76" r="5.5" fill="#b22d2a" stroke="#ff4a3d" stroke-width=".8"/>
        <circle cx="50" cy="89" r="5.5" fill="#a77506" stroke="#f2b21c" stroke-width=".8"/>
      </svg>`
    },
    {
      path: 'thermite/',
      job: 'bobcat',
      name: 'Thermite',
      desc: 'Watch the squares jump around, memorize where they stop, then left-click every square that was lit.',
      tags: ['Memory', '7×7 grid', '35s timer'],
      thumb: `<svg viewBox="0 0 100 100">
        ${Array.from({length:25},(_,i)=>{const r=i/5|0,c=i%5,on=[1,8,10,17,23].includes(i);
          return `<rect x="${12+c*16}" y="${12+r*16}" width="13" height="13" rx="2" fill="${on?'rgba(255,170,0,.2)':'#18191b'}" stroke="${on?'#ffab00':'#2a2b2e'}" stroke-width="1"/>`+(on?`<circle cx="${18.5+c*16}" cy="${18.5+r*16}" r="2.4" fill="#ffab00"/>`:'')}).join('')}
      </svg>`
    },
    {
      path: 'usb/',
      job: 'bobcat',
      name: 'USB Drive – Ring Match',
      desc: 'Type the terminal commands exactly, then rebuild the captured signature: pick the matching fragment for each of the 4 rings, inside out.',
      tags: ['Typing', 'W/S or ↑/↓ + Enter', '2:00 timer'],
      thumb: `<svg viewBox="0 0 100 100" fill="none" stroke-linecap="butt">
        <circle cx="50" cy="50" r="5" stroke="#46f585" stroke-width="1.2"/>
        <g stroke="#46f585" stroke-width="3">
          <path d="M50 34 A16 16 0 1 1 36 58"/>
          <path d="M50 26 A24 24 0 0 1 72 60" stroke-dasharray="5 3"/><path d="M60 72 A24 24 0 0 1 27 44"/>
          <path d="M18 50 A32 32 0 0 1 70 25"/><path d="M80 40 A32 32 0 0 1 40 81"/>
          <path d="M10 50 A40 40 0 0 1 50 10" stroke-dasharray="6 3"/><path d="M62 12 A40 40 0 0 1 22 79"/>
        </g>
        <g stroke="#a9f3c4" stroke-width=".8"><path d="M50 8V20M84 62L94 66M14 30L22 34M64 88L60 78"/></g>
        <g fill="#d9e46a"><rect x="72" y="16" width="5" height="4"/><rect x="12" y="62" width="5" height="4"/><rect x="82" y="78" width="5" height="4"/></g>
      </svg>`
    },
  ];

  function card(g){
    const a = document.createElement('a');
    a.className = 'card'; a.href = g.path;
    a.innerHTML = `<div class="thumb">${g.thumb}</div>
      <div class="body"><h3></h3><p></p><div class="tags"></div></div>`;
    a.querySelector('h3').textContent = g.name;
    a.querySelector('p').textContent = g.desc;
    const t = a.querySelector('.tags');
    for (const tag of g.tags){ const s = document.createElement('span'); s.textContent = tag; t.appendChild(s); }
    return a;
  }

  const jobsEl = document.getElementById('jobs');
  for (const job of JOBS){
    const games = GAMES.filter(g => g.job === job.id);
    if (!games.length) continue;
    const count = `${games.length} hack${games.length === 1 ? '' : 's'}`;
    const sec = document.createElement('section');
    sec.className = 'job'; sec.id = job.id;
    sec.innerHTML = '<h2><span></span><small></small></h2><div class="grid"></div>';
    sec.querySelector('h2 span').textContent = job.name;
    sec.querySelector('h2 small').textContent = count;
    const grid = sec.querySelector('.grid');
    games.forEach(g => grid.appendChild(card(g)));
    jobsEl.appendChild(sec);
  }
  // games without a known job still show up
  const other = GAMES.filter(g => !JOBS.some(j => j.id === g.job));
  if (other.length){
    const sec = document.createElement('section'); sec.className = 'job'; sec.id = 'other';
    sec.innerHTML = '<h2><span>Other</span></h2><div class="grid"></div>';
    other.forEach(g => sec.querySelector('.grid').appendChild(card(g)));
    jobsEl.appendChild(sec);
  }
  if (location.hash) document.getElementById(location.hash.slice(1))?.scrollIntoView();
</script>
</body>
</html>
